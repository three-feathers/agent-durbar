<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<title>Agent Durbar</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="screens.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs><filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter></defs></svg>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="var(--brand-mark,#4f7f65)" stroke-width="1.7" stroke-linejoin="round"><rect x="2.5" y="2.5" width="6" height="7" rx="1.5"/><rect x="11.5" y="2.5" width="6" height="4" rx="1.5"/><rect x="11.5" y="9" width="6" height="8.5" rx="1.5"/><rect x="2.5" y="12.5" width="6" height="5" rx="1.5"/></svg></div>
    <div><h1>Agent Durbar</h1><span class="proto" id="protoBadge">Prototype - sample data</span></div>
  </div>
  <div class="stats" id="stats" role="group" aria-label="Agent status counts. Select one to filter."></div>
  <div class="controls">
    <div id="liveBar">
      <label class="tgl"><input type="checkbox" id="demoToggle"> Demo</label>
      <button class="btn" id="addFolder" type="button" title="Add a folder">+ Folder</button>
      <button class="btn" id="addWs" type="button" title="Add a .code-workspace file">+ Workspace</button>
      <label class="sr-only" for="kindSel">Agent kind for new folders and sessions</label>
      <select id="kindSel" title="Agent kind for new folders and sessions" style="max-width:96px" hidden></select>
      <button class="btn" id="kindHelp" type="button" aria-label="About agent kinds" title="About agent kinds" style="padding:0 8px" hidden>?</button>
      <label class="sr-only" for="permMode">Permissions for new agents</label>
      <select id="permMode" title="Permissions for newly added agents"><option value="read-only">Read-only</option><option value="ask">Ask first</option><option value="allow">Allow all (no prompts)</option></select>
      <label class="sr-only" for="modelSel">Model for new sessions</label>
      <select id="modelSel" title="Model for new sessions (what your Copilot account offers)"><option value="auto">Model: Auto</option></select>
      <label class="sr-only" for="effortSel">Reasoning effort for new sessions</label>
      <select id="effortSel" title="Reasoning effort (only for models that support it)" hidden></select>
      <button class="btn" id="foldersBtn" type="button" aria-haspopup="true" aria-expanded="false" title="Manage folders: new session, hide, remove">Folders</button>
      <button class="btn" id="floorsBtn" type="button" aria-haspopup="true" aria-expanded="false" title="Floors: groups of folders you can switch off" hidden></button>
    </div>
    <label class="select-wrap"><span class="sr-only">Filter by folder</span>
      <select id="wsFilter"></select></label>
    <div class="seg" id="doorBar" role="group" aria-label="Room doors" hidden>
      <button id="closeAll" type="button" title="Close the door of every room (compact door plates)">Close all</button>
      <button id="openAll" type="button" title="Open the door of every room">Open all</button>
    </div>
    <div class="seg" id="topBtns" role="group" aria-label="Tools and settings">
      <button id="toolsBtn" type="button" aria-pressed="false" title="Which tools agents used and how often; models and context window per agent">Tools</button>
      <button id="settingsBtn" type="button" aria-pressed="false" title="Settings: MCP servers for all agents">Settings</button>
    </div>
    <div class="seg" role="group" aria-label="View">
      <button id="vOffice" aria-pressed="true">Office</button>
      <button id="vList" aria-pressed="false">List</button>
    </div>
  </div>
</header>

<div class="workspace">
  <div id="stage-host">
    <main id="floor" aria-label="Office floor plan"><div id="stage" class="stage"></div><div id="probe" class="stage" aria-hidden="true" inert></div><div id="walkers" aria-hidden="true"></div></main>
  </div>
  <section id="list" aria-label="Agent list"></section>
  <aside id="panel" aria-label="Agent details"></aside>
</div>
<section id="screen" aria-label="Settings and tools" hidden></section>
<div id="foldersPop" role="dialog" aria-label="Folders" hidden></div>
<div id="floorsPop" class="floors-ui" role="dialog" aria-label="Floors" tabindex="-1" hidden></div>
<div id="toasts" role="status" aria-live="polite"></div>

<script src="vendor/marked.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="markdown.js"></script>
<script src="dialog.js"></script>
<script src="roomsummary.js"></script>
<script src="usagetotals.js"></script>
<script src="modelswitch.js"></script>
<script src="places.js"></script>
<script src="place-icons.js"></script>
<script src="mood.js"></script>
<script src="toolstats.js"></script>
<script src="theme.js"></script>
<script src="scenekits.js"></script>
<script src="screens.js"></script>
<script src="demo.js"></script>
<script src="sim.js"></script>
<script src="app.js"></script>
<script src="renderer.js"></script>
</body>
</html>
