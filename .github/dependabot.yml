# Supply-chain hardening (spec 021 FR-062, delta 2026-10-28). Weekly, grouped: one pull request per ecosystem per week, few open at once.
# Only minor and patch updates are grouped; a semver-major update is planned work with its own spec, so Dependabot ignores it.
# `electron` is ignored entirely: it is pinned exactly and its runtime is verified against pinned hashes (spec 008 FR-132..134), so a bump is a hand-made PR that updates the pins.
# `cooldown`: a release must be 7 days old before Dependabot proposes it (PR #828 carried 5- and 4-day-old releases); security updates are not delayed.
# A Dependabot PR is reviewed by a human before merge: lockfile changes and new transitive packages are never merged on CI alone.
# The PR body quotes upstream release notes: untrusted text (AGENTS.md, Untrusted content and prompt injection).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels: [task, area:ci, area:security, spec:021]
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels: [task, area:security, spec:021]
    groups:
      npm:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      - dependency-name: electron
  - package-ecosystem: npm
    directory: /scripts/prereview
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    labels: [task, area:security, spec:103]
    groups:
      prereview:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      - dependency-name: electron
