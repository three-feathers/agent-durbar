name: E2E real accounts

# spec 062: on every supported OS (.github/platforms.json), install each agent app the way Durbar does, sign in with the CI
# account's secrets, list models and run one tiny read-only turn, through Durbar's own adapters (scripts/e2e-real.ts).
# USES A FEW CREDITS. Cost cut 2026-10-22 (owner; spec 062 FR-006..FR-008): no push trigger, at most one scheduled run a day; the
# turn (one one-line prompt per app, Codex on a small model) runs daily on Linux only, and on macOS and Windows on Mondays or a
# manual run with full_turn. The other days they install, sign in and list models (no prompt, no tokens).
# NEVER on pull_request: PR code never runs with these secrets.
on:
  workflow_dispatch:
    inputs:
      full_turn:
        description: 'Run the one-line turn on macOS and Windows too (Linux always runs it)'
        type: boolean
        default: false
  # PAUSED 2026-10-29 (owner, Vikram; spec 062 delta 2026-10-29, FR-009; tracking issue #856): red on every scheduled day since
  # 2026-10-25, spending credits. Run it by hand (workflow_dispatch) while the cause is found. To re-enable: restore the block
  # below and the cron check in scripts/test-platforms.ts (task T009).
  # schedule:
  #   - cron: '17 5 * * *' # daily, 05:17 UTC; Monday's run is the full one on every OS

permissions:
  contents: read

concurrency:
  group: e2e-real
  cancel-in-progress: false

jobs:
  platforms:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      list: ${{ steps.p.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: p
        run: echo "list=$(jq -c . .github/platforms.json)" >> "$GITHUB_OUTPUT"

  e2e:
    name: E2E (${{ matrix.os }})
    needs: platforms
    # spec 021 FR-062: the secrets can live in this environment, where the owner can require a reviewer before a run starts
    environment: copilot
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.platforms.outputs.list) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -p tsconfig.scripts.json
      # Codex's read-only sandbox on Linux needs unprivileged user namespaces, which Ubuntu 24.04 restricts by default (Durbar tells
      # users the same). The runner allows them so the read-only path is really tested here.
      - name: Allow unprivileged user namespaces (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # FR-007: the turn on Linux every run; on macOS and Windows only on Monday's scheduled run or a manual run with full_turn
      - name: Turn or no turn
        id: mode
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          FULL_TURN: ${{ inputs.full_turn }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ] || { [ "$EVENT" = "workflow_dispatch" ] && [ "$FULL_TURN" = "true" ]; } || { [ "$EVENT" = "schedule" ] && [ "$(date -u +%u)" = "1" ]; }; then
            echo "flag=" >> "$GITHUB_OUTPUT"
          else
            echo "flag=--no-turn" >> "$GITHUB_OUTPUT"
          fi
      # the only step that sees the secrets; the script prints nothing of them (redact, stdin for the Codex key)
      - name: Install, sign in, list models, one turn
        shell: bash
        env:
          E2E_FLAG: ${{ steps.mode.outputs.flag }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_CODEX_GITHUB_FINE_GRAINED_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node dist-scripts/scripts/e2e-real.js "$RUNNER_TEMP/e2e.json" ${E2E_FLAG:+"$E2E_FLAG"} | tee "$RUNNER_TEMP/e2e.md"
      - name: Summary
        if: always()
        shell: bash
        run: '[ -f "$RUNNER_TEMP/e2e.md" ] && sed -n "/^### E2E/,\$p" "$RUNNER_TEMP/e2e.md" >> "$GITHUB_STEP_SUMMARY" || true'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/e2e.json
            ${{ runner.temp }}/e2e.md
          retention-days: 30
          if-no-files-found: ignore
