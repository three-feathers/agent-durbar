name: CI

# Spec 008 FR-104..FR-110 (owner decision 2026-10-22, "come out of this CI bottleneck"): a pull request costs as few runner
# tickets as possible, because on the Free plan the queue wait (10-30 min) is much longer than any job (1-3 min).
#   - no separate "What changed" job: each job works out what changed itself (.github/scripts/ci-changes.sh), so no job waits
#     for another job's runner first (one exception, spec 117 FR-018: the short "Build and test (<os>)" summaries wait for the npm test parts);
#   - one office layout job instead of 6 shards and a summary job: the parts run in parallel on one runner (check-parallel.js);
#   - macOS does not run on pull requests or merge queue entries (it had the longest queue): the required check
#     "Build and test (macos-latest)" reports from the short Linux summary job, which says so; the real macOS build and test runs on every
#     push to main, nightly and by hand, and a nightly failure opens or updates an issue (nightly-watch.yml);
#   - drafts run nothing until they are marked ready for review; a newer push cancels the PR's older run;
#   - FR-191 (owner decision 2026-11-08): on a pull request the office job (office layout and, since FR-194, package smoke) runs
#     its steps only when something the app, its build, its packaging or the UI drivers use changed (`ui` from ci-changes.js); a
#     tooling, report or unit-test script, or a version-only bump, skips them and the required check passes. Build and test keeps
#     `code` (unit tests read the version). Main, the merge queue, the nightly and by-hand runs run everything.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # spec 008 FR-098: the merge queue runs the required checks on each queue entry (like a push to main, without macOS: FR-106)
  merge_group:
  # FR-106: nightly, with the real macOS build and test
  schedule:
    - cron: '41 2 * * *'
  # spec 008 FR-031: the full layout matrix in every theme runs only on demand:
  #   gh workflow run ci.yml --ref <branch> -f full_themes=true
  workflow_dispatch:
    inputs:
      full_themes:
        description: Also run the full office layout check in every theme
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # FR-107: one group per pull request (a newer push cancels the older run); every other run has its own group, so runs on main,
  # merge queue entries and nightly runs never cancel or wait for each other (a release is tagged on a main commit)
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Spec 117 FR-018 (#1983; spec delta 2026-11-22): `npm test` runs in 2 parts per OS, each its own job, so a slow runner no longer hits the
  # 25-minute limit with the whole list (Windows took 14 to 25 min, Linux and macOS up to 22). `run-tests.js` splits test-suites.txt by the
  # recorded seconds in scripts/test-suite-timings.json (the same greedy split as the UI suite, scripts/time-shard.js) and refuses to run a part
  # unless every suite is in exactly one part. The required check "Build and test (<os>)" is the summary job `build-test` below: it waits for its
  # OS's parts and fails when any part failed, was cancelled or was skipped (the ruleset is not changed). FR-104's "no needs:" has this one
  # exception: only the summary waits, the parts start at once. Each part job is one OS so the summary of one OS reads only its own parts.
  test-ubuntu:
    name: Build and test (ubuntu-latest) part ${{ matrix.shard }}/2
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    # spec 008 FR-195: npm ci may wait out an Electron download outage (about 12 min). Spec 117 T025 stop-gap (#2026): 45 while #1983 is open, kept
    # on every part job (the parts took 12-14 min on Windows in this PR's run, too few runs to trust 25 on a slow runner); T025 lowers it after measuring
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: bash .github/scripts/ci-changes.sh
      - if: steps.changes.outputs.code == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - if: steps.changes.outputs.code == 'true'
        uses: ./.github/actions/npm-ci
      # spec 103: test:prereview drives the real pinned Agent SDK binary against a loopback mock (fake key, no network); only Linux installs it,
      # in both parts, so the time split may move test:prereview without breaking it
      - if: steps.changes.outputs.code == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix scripts/prereview
      # spec 008 FR-193: no separate typecheck step; `npm run build` runs the same `tsc -p tsconfig.json` and fails on type errors (scripts/test-ci-typecheck.js)
      - if: steps.changes.outputs.code == 'true'
        run: npm run build
      # compiles the test scripts once and runs this part's suites in parallel (scripts/run-tests.js)
      - if: steps.changes.outputs.code == 'true'
        env:
          TEST_SHARD: ${{ matrix.shard }}/2
          # spec 117 T500: 4 vCPU here (run-tests.js printed "3 at a time"); not on macOS, whose runner size varies
          TEST_JOBS: 4
          # spec 103: on Linux test:prereview must run the real-SDK test, never skip it (the install step above)
          PREREVIEW_REQUIRE_REAL_SDK: '1'
        run: npm test
      # spec 102 T201: the art build script's own checks, and T296's frame guard (FR-326); they need Pillow, nothing else does, and no art is made here (part 1 only)
      - if: steps.changes.outputs.code == 'true' && matrix.shard == 1
        name: Art build script selftest
        run: |
          python3 -m venv "$RUNNER_TEMP/art"
          "$RUNNER_TEMP/art/bin/pip" install --quiet pillow==11.3.0
          "$RUNNER_TEMP/art/bin/python" -I scripts/build-arcade-pack.py --selftest
          PATH="$RUNNER_TEMP/art/bin:$PATH" DURBAR_REQUIRE_PILLOW=1 node scripts/test-character-groups.js
          PATH="$RUNNER_TEMP/art/bin:$PATH" DURBAR_REQUIRE_PILLOW=1 npm run test:realoffice-assets

  test-windows:
    name: Build and test (windows-latest) part ${{ matrix.shard }}/2
    if: ${{ !github.event.pull_request.draft }}
    runs-on: windows-latest
    timeout-minutes: 45 # spec 117 T025 stop-gap, as test-ubuntu
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: bash .github/scripts/ci-changes.sh
      - if: steps.changes.outputs.code == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - if: steps.changes.outputs.code == 'true'
        uses: ./.github/actions/npm-ci
      - if: steps.changes.outputs.code == 'true'
        run: npm run build
      - if: steps.changes.outputs.code == 'true'
        env:
          TEST_SHARD: ${{ matrix.shard }}/2
          # spec 117 T500: 4 vCPU here (run-tests.js printed "3 at a time"); not on macOS, whose runner size varies
          TEST_JOBS: 4
        run: npm test

  # FR-106: no macOS runner on pull requests or merge queue entries (the summary reports for macOS there); every other event runs the real macOS parts
  test-macos:
    name: Build and test (macos-latest) part ${{ matrix.shard }}/2
    if: ${{ !github.event.pull_request.draft && github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
    runs-on: macos-latest
    timeout-minutes: 45 # spec 117 T025 stop-gap, as test-ubuntu
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: bash .github/scripts/ci-changes.sh
      - if: steps.changes.outputs.code == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - if: steps.changes.outputs.code == 'true'
        uses: ./.github/actions/npm-ci
      - if: steps.changes.outputs.code == 'true'
        run: npm run build
      - if: steps.changes.outputs.code == 'true'
        env:
          TEST_SHARD: ${{ matrix.shard }}/2
        run: npm test

  # The required checks "Build and test (ubuntu-latest | windows-latest | macos-latest)" (spec 117 FR-018): a short Linux job per OS that passes
  # only when every part of that OS passed. `always()` (as FR-183's "UI suite complete") so a failed or cancelled part cannot skip it (GitHub counts a
  # skipped required check as passing); a failed, cancelled or skipped part fails it, except the macOS parts on pull requests and merge queue entries,
  # which FR-106 skips on purpose. permissions: {}: it reads only the needs results.
  build-test:
    name: Build and test (${{ matrix.os }})
    needs: [test-ubuntu, test-windows, test-macos]
    if: ${{ always() && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Every part of npm test passed
        shell: bash
        env:
          OS: ${{ matrix.os }}
          EVENT_NAME: ${{ github.event_name }}
          UBUNTU: ${{ needs.test-ubuntu.result }}
          WINDOWS: ${{ needs.test-windows.result }}
          MACOS: ${{ needs.test-macos.result }}
        run: |
          case "$OS" in
            ubuntu-latest) result="$UBUNTU" ;;
            windows-latest) result="$WINDOWS" ;;
            macos-latest) result="$MACOS" ;;
            *) echo "unknown OS: $OS"; exit 1 ;;
          esac
          if [ "$OS" = macos-latest ] && { [ "$EVENT_NAME" = pull_request ] || [ "$EVENT_NAME" = merge_group ]; }; then
            echo "macOS build and test does not run on pull requests or merge queue entries (spec 008 FR-106, owner decision 2026-10-22)." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "It runs on every push to main, nightly (a failure opens or updates an issue) and by hand: gh workflow run ci.yml --ref <branch>" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$result" = skipped ]; then exit 0; fi
            echo "FAILED: the macOS parts should be skipped here, but their result is: $result" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "$OS: test parts: ${result:-none}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$result" != success ]; then
            echo "FAILED: a test part on $OS failed, was cancelled or was skipped (${result:-none}); every suite must pass on every OS" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # The required check "Office layout check (xvfb)" is this one job (FR-105; it was 6 shard jobs and a summary job). Since FR-194
  # it also covers packaging (it was the separate job "Package smoke (unpacked Linux app)"): one build, then the layout steps,
  # then the unpacked-app build, each step run even if the one before failed, and the last step names which part failed. Simulator
  # only (no login, no credits). Theme geometry first (spec 008 FR-031: a theme may not change sizes, so the full layout check
  # runs in Clean Office only and geometry proves every other theme lays out the same), then the office layout in CHECK_SHARDS
  # parts, CHECK_JOBS at a time, each in its own Electron and xvfb display (scripts/check-parallel.js), motion on as before.
  office-check:
    name: Office layout check (xvfb)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CHECK_SHARDS: '3'
      CHECK_JOBS: '3'
      CHECK_MOTION: '1'
      # spec 035 FR-414 (d), amends 008 FR-111: theme geometry checks every theme whenever it runs; on a pull request it runs only when the
      # look or its checks can change (the `themes` decision of ci-changes.js). The dark fixture alone let PR #2057's lobby change through
      CHECK_ALL_THEMES: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: bash .github/scripts/ci-changes.sh
      - if: steps.changes.outputs.ui == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - if: steps.changes.outputs.ui == 'true'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - id: install
        if: steps.changes.outputs.ui == 'true'
        uses: ./.github/actions/npm-ci
      - id: build
        if: steps.changes.outputs.ui == 'true'
        run: npm run build
      - name: Theme geometry
        id: geometry
        if: steps.changes.outputs.ui == 'true' && steps.changes.outputs.themes == 'true' && steps.build.outcome == 'success'
        run: node scripts/check-theme-geometry.js
      - name: Office layout (15 agents, 1440x900 and 1280x800), parts in parallel
        if: ${{ !cancelled() && steps.changes.outputs.ui == 'true' && steps.build.outcome == 'success' }}
        id: layout
        run: node scripts/check-parallel.js
      # FR-194: packaging runs whatever the layout steps did (!cancelled(), so a cancelled run stops at once), but only on a build that
      # succeeded (a failed install or build is reported as that, not as the parts that had nothing to run on). Builds the app with electron-builder and
      # fails if the Copilot runtime is not unpacked (scripts/after-pack.js), then the fuse, signature and name checks.
      - name: Package smoke (unpacked Linux app)
        if: ${{ !cancelled() && steps.changes.outputs.ui == 'true' && steps.build.outcome == 'success' }}
        id: package
        run: npm run pack:dir:prebuilt
      # FR-194: the job fails if either part failed, and the summary says which (outcomes only, no PR text in the shell)
      - name: Which part failed
        if: always()
        shell: bash
        env:
          INSTALL: ${{ steps.install.outcome }}
          BUILD: ${{ steps.build.outcome }}
          GEOMETRY: ${{ steps.geometry.outcome }}
          LAYOUT: ${{ steps.layout.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
        run: |
          failed=0
          for part in INSTALL BUILD GEOMETRY LAYOUT PACKAGE; do
            outcome="${!part}"
            echo "$part: ${outcome:-skipped}" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$outcome" = failure ] || [ "$outcome" = cancelled ]; then failed=1; echo "FAILED PART: $part" | tee -a "$GITHUB_STEP_SUMMARY"; fi
          done
          exit "$failed"

  # On demand only (workflow_dispatch with full_themes): the full office check in every other theme, reduced motion, 2 shards each.
  theme-shard:
    name: Theme layout ${{ matrix.theme }} ${{ matrix.shard }}/2
    if: github.event_name == 'workflow_dispatch' && inputs.full_themes
    runs-on: ubuntu-latest
    # spec 008 FR-195: was 12; about 3 min of work plus up to about 12 min of npm ci retries in an Electron download outage
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        theme: [dark, user, mine] # mine: spec 096 SC-002, My characters on Clean Office
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/npm-ci
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - shell: bash
        env:
          OFFICE_SHARDS: 2
          OFFICE_SHARD: ${{ matrix.shard == 1 && '0' || '1' }}
          OFFICE_REDUCED_MOTION: 1
          THEME: ${{ matrix.theme }}
        run: |
          if [ "$THEME" = mine ]; then export OFFICE_CHARACTERS=mine; elif [ "$THEME" = user ]; then export OFFICE_USER_THEME=scripts/fixtures/themes/check-user.json; else export OFFICE_USER_THEME=scripts/fixtures/themes/check-dark.json CHECK_EXPECT_DARK=1; fi
          npm run check:office
