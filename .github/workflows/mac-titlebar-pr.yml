name: Mac title bar on pull requests

# Spec 008 FR-200 (Paco 2026-11-10) ran this one check on one macOS runner on a pull request that changed the renderer's CSS.
# REVERSED by the spec 008 delta 2026-11-23 (owner decision, spec 117 O1): no macOS runner runs on a pull request any more
# (scripts/test-ci-macos-off-prs.ts). This file stays for a by-hand run on a branch that changes the renderer's CSS or the check:
# `gh workflow run mac-titlebar-pr.yml --ref <branch>`. The nightly runs the same check (ui-platforms.yml, FR-108). Simulator only:
# no account, no agent session, no credits, no secrets. The names are kept so `npm run ci:stats` still matches the older runs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac-titlebar:
    name: Mac title bar (path-filtered)
    runs-on: macos-latest
    # spec 008 FR-195: about 6 min of work plus up to about 12 min of npm ci retries in an Electron download outage
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/npm-ci
      - run: npm run build
      # same command as the nightly (ui-platforms.yml): macOS has a display, so no xvfb
      - name: Mac title bar
        run: node scripts/check-mac-titlebar.js
