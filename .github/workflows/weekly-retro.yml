name: Weekly retro

# Spec 021 FR-063 / T049 (retro #854): every Monday opens ONE issue "Weekly retro <YYYY>-W<ww>" with last week's facts (aggregates
# only) and a checklist for the three agent sides. No AI call and no third-party action: scripts/weekly-retro.js uses the
# GITHUB_TOKEN through the preinstalled gh. It skips when that week's issue by github-actions[bot] already exists, so a manual
# run is safe. The schedule fires only from main.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  contents: read
  actions: read

concurrency:
  group: weekly-retro
  cancel-in-progress: false

jobs:
  retro:
    name: Open the weekly retro issue
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Gather facts and open the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/weekly-retro.js
