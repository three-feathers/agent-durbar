name: Packaged check

# spec 012 T044: package the app (unsigned, --dir) on macOS, Windows and Linux and run `scripts/pack-esm-check.js`
# inside each packaged main process: ESM import from app.asar, a missing Claude Agent SDK, both harnesses registered,
# the CLI fallback. No SDK, no claude or codex run, no credits, no publishing.
# Not a pull-request check (it would slow every PR): it runs on main when the adapters, the main process or packaging
# change, on demand, and on a pull request that changes the check itself.
on:
  push:
    branches: [main]
    paths:
      - 'src/adapters/**'
      - 'src/main/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/prepare-runtime.js'
      - 'scripts/pack-esm-*.js'
      - '.github/workflows/packaged-check.yml'
  pull_request:
    paths:
      - 'scripts/pack-esm-*.js'
      - '.github/workflows/packaged-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaged-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Packaged check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npm ci
      - name: Package (unsigned, --dir, no publishing)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run pack:dir
      - run: node scripts/pack-esm-ci.js
