name: macOS on pull requests

# Spec 008 FR-135 (2026-10-29) ran the real macOS build and test on pull requests that touched OS-sensitive paths. REVERSED by the
# spec 008 delta 2026-11-23 (owner decision, spec 117 O1): it caught 0 of 241 failures Linux had missed, took 17 to 24 minutes, and
# GitHub's hosted macOS capacity cancelled jobs before they started. No macOS runner runs on a pull request any more
# (scripts/test-ci-macos-off-prs.ts). This file stays for a by-hand run on a branch whose change may break only on a Mac:
# `gh workflow run macos-pr.yml --ref <branch>`; it always runs the whole build and test. macOS still runs on every `main` push and
# nightly (ci.yml, FR-106). The workflow and job names are kept so `npm run ci:stats` still matches the older runs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-test:
    name: macOS build and test (path-filtered)
    runs-on: macos-latest
    # spec 008 FR-195: was 20; up to 9 min of work plus up to about 12 min of npm ci retries in an Electron download outage
    # spec 117 T078: was 25; the job was cut at the limit with no assert failing (8 of 12 runs over 20 min); kept for by-hand runs (T079 obsolete)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/npm-ci
      # spec 008 FR-193: build runs the same tsc as typecheck
      - run: npm run build
      - run: npm test
