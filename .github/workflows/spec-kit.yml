name: Spec Kit

# Fails a pull request whose branch is not NNN-slug (warning only for non-agent bot branches), or that changes src/ without
# changing a complete specs/NNN-*/ folder (spec.md, plan.md, tasks.md) -- unless it has a Spec-Exempt reason or label.
# Logic lives in .github/scripts/spec-gate.sh. Runs on description edits too, so a "Spec-Exempt: <reason>" line re-evaluates the
# check. Spec 008 FR-109 (owner decision 2026-10-22): no longer on `labeled`/`unlabeled` (every label change cost a runner); after
# a maintainer adds the `spec-exempt` label, save the description once (or push) to re-run the gate: a re-run of the old run
# would read the old labels. Drafts run nothing until they are marked ready for review.
# The second job (Docs check, warning only) lives in the same file; see .github/scripts/docs-check.sh. It never fails and is not a required check.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  # spec 008 FR-098: the required Spec Kit gate must report on merge queue entries too, or the queue waits for it forever
  merge_group:

permissions:
  contents: read

concurrency:
  # FR-107: one group per pull request (bursts of description edits collapse to the newest); a queue entry has no PR number,
  # so its run id keeps entries from cancelling each other
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  spec-gate:
    name: Spec Kit gate
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none # partial clone: every commit and tree, file contents fetched when read (the 1.3 GB full clone hit the 10-minute job limit, 2026-11-03)
      # FR-098: a merge queue entry was gated on its pull request (branch name, spec folder, PR description); the queue entry has
      # no PR description to read, so the gate reports success and says why
      - name: Merge queue entry (gated on its pull request)
        if: github.event_name == 'merge_group'
        run: |
          echo "Merge queue entry: the Spec Kit gate ran on the pull request that joined the queue." >> "$GITHUB_STEP_SUMMARY"
      - name: Gate script self-test (throwaway repos, no network)
        if: github.event_name == 'pull_request'
        run: bash .github/scripts/test-spec-gate.sh
      - name: Branch is NNN-slug; src/ changes need the spec folder
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: bash .github/scripts/spec-gate.sh

  # Reminder only: warns (annotation + summary) when src/ changes without README/docs/a changelog.d fragment, or npm scripts change
  # without README, or a PR hand-edits CHANGELOG.md's Unreleased or the generated specs/README.md (spec 025 delta 2026-10-22),
  # unless the PR says "Docs: n/a <reason>". It cannot block: continue-on-error, the script always exits 0, and this job
  # is deliberately NOT in the required checks of the main ruleset (.github/ruleset-main.json).
  docs-check:
    name: Docs check (warning only)
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none # partial clone: every commit and tree, file contents fetched when read (the 1.3 GB full clone hit the 10-minute job limit, 2026-11-03)
      - name: Docs check self-test (throwaway repos, no network)
        run: bash .github/scripts/test-docs-check.sh
      - name: Warn when docs may be missing
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: bash .github/scripts/docs-check.sh

  # Spec 008 FR-185 / spec 021 FR-085: no number clash with main or another open PR (scripts/spec-numbers.js) and no picture over budget
  # (scripts/picture-budget.js, strict: a missing origin/main fails). Not a required check: it needs the network, and a blip must not block a merge.
  # Workflow files are CODEOWNERS.
  #
  # Threat model, and its limits (reviews of PR #1316). What protects the token here is GitHub's policy and the job's own settings, in this order:
  #  - A fork PR gets a read-only token and no secrets by GitHub's rules (and a first-time contributor's run needs an owner's approval). The jobs
  #    use `pull_request`, never `pull_request_target` (a test fails if that word appears anywhere outside comments), so that policy applies.
  #  - Each job's `permissions:` is read-only (`contents: read`, plus `pull-requests: read` for `gh pr list`), and no other secret is used.
  #  - `persist-credentials: false` on every checkout leaves no credential in .git/config for code in the checkout to read.
  # What the split into two jobs and the base copy do NOT do: on `pull_request` the workflow file itself is read from the PR's merge commit, so a
  # same-repo PR can rewrite this file, ask for `contents: write` or more, and run its own code with GH_TOKEN (read-only only by this repository's default
  # setting for the token, which was checked, not by anything in this file). Running `base/scripts/` protects
  # against a PR that changes the SCRIPTS in an unmodified workflow, not against a modified workflow. CODEOWNERS review of `.github/` gates the MERGE
  # only: a changed workflow has already run on the PR by then. The older jobs above (`spec-gate`, `docs-check`) also run PR scripts with their checkout credentials kept.
  # Within that:
  #  - `spec-numbers-selftest` runs the PR's OWN scripts and self-tests, and no step of it has a token in its environment. It is a separate job
  #    so PR code cannot write GITHUB_ENV or GITHUB_PATH, or change files, for the token step. (The job's token still exists in the runner's
  #    memory while it runs: read-only by that default, low impact.)
  #  - `spec-numbers` runs the BASE branch's copy of the scripts (`base/`, the sha the PR targets, reviewed on main) on the PR checkout (`pr/`),
  #    read as data; GH_TOKEN (the default GITHUB_TOKEN, used by `gh pr list`) is in the environment of that one step only.
  # Nothing from the PR is put in a shell string or `${{ }}` in `run:`. The scripts print no environment value. A path or name from the PR is
  # escaped before it is printed (control characters, `::` and `##[`), so a file name cannot add an annotation or a workflow command.
  spec-numbers-selftest:
    name: Number and picture checks, self-tests
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Self-tests of the PR's scripts (throwaway repos, no network, no token)
        run: |
          node scripts/test-picture-budget.js
          node scripts/test-spec-numbers.js

  spec-numbers:
    name: Spec numbers and picture budget
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: PR checkout (data only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          fetch-depth: 0
          filter: blob:none # partial clone: the history is needed for the merge-base, file contents are fetched when read
          persist-credentials: false
      - name: Base checkout (the scripts that run)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: No picture over the budget (base script, no token)
        run: |
          if [ ! -f base/scripts/picture-budget.js ]; then
            echo "scripts/picture-budget.js is not on the base branch yet (the PR that adds it): not run. It runs from the next PR on."
            exit 0
          fi
          node base/scripts/picture-budget.js --strict --root pr
      - name: No spec number taken twice (base script)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ ! -f base/scripts/spec-numbers.js ]; then
            echo "scripts/spec-numbers.js is not on the base branch yet (the PR that adds it): not run. It runs from the next PR on."
            exit 0
          fi
          node base/scripts/spec-numbers.js --root pr
