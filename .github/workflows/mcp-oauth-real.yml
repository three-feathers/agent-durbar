name: MCP OAuth real check

# spec 058 T116 (real check for T105, FR-064 and FR-070): through Durbar's Copilot adapter, sign in to a loopback demo MCP server that
# requires OAuth (scripts/demo-oauth-mcp.ts), then check that a NEW session in a NEW runtime process connects without a new sign-in.
# 0 prompts (no message is sent), but it starts the Copilot runtime with the CI account. MANUAL ONLY: never on pull_request or push,
# so PR code never runs with the secret.
on:
  workflow_dispatch:
    inputs:
      oses:
        type: choice
        description: 'Run on both original runners or select one runner'
        required: true
        default: both
        options:
          - both
          - windows-latest
          - ubuntu-latest
          - macos-latest

permissions:
  contents: read

concurrency:
  group: mcp-oauth-real
  cancel-in-progress: false

jobs:
  check:
    name: MCP OAuth (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Map only to fixed GitHub-hosted labels; unknown input falls back to the original safe pair.
        os: ${{ fromJSON(inputs.oses == 'both' && '["windows-latest","ubuntu-latest"]' || inputs.oses == 'windows-latest' && '["windows-latest"]' || inputs.oses == 'ubuntu-latest' && '["ubuntu-latest"]' || inputs.oses == 'macos-latest' && '["macos-latest"]' || '["windows-latest","ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -p tsconfig.scripts.json
      # the demo server enforces the flow (401, PKCE, one-use codes) before the real check trusts its counters
      - run: node dist-scripts/scripts/test-demo-oauth-mcp.js
      # the only step that sees the secret; the script prints nothing of it (redact), and no message is sent (0 prompts)
      - name: Sign in once, then a new session in a new runtime
        shell: bash
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_CODEX_GITHUB_FINE_GRAINED_TOKEN }}
        run: node dist-scripts/scripts/mcp-oauth-real.js "$RUNNER_TEMP/mcp-oauth.json"
      - name: Summary
        if: always()
        shell: bash
        run: '[ -f "$RUNNER_TEMP/mcp-oauth.md" ] && cat "$RUNNER_TEMP/mcp-oauth.md" >> "$GITHUB_STEP_SUMMARY" || true'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mcp-oauth-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/mcp-oauth.json
            ${{ runner.temp }}/mcp-oauth.md
          retention-days: 30
          if-no-files-found: ignore
