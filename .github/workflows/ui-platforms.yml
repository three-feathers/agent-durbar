name: UI on three OSes

# spec 008 FR-092: the simulator UI checks on macOS, Windows and Linux. The unit tests already run in ci.yml; this adds theme
# geometry, the 15-agent office layout (1440x900 and 1280x800, with that OS's fonts), the Mac title bar check (on the Mac runner)
# and every assertion-bearing driver (`scripts/ui-suite.js`). Screenshots are uploaded per OS. Simulator only: no account, no
# agent session, no credits. Not a required check (making it required is a repo setting: the owner's call).
#
# Spec 008 FR-108 (owner decision 2026-10-22): ONE job per OS, now four shards on every OS (FR-182, FR-183; macOS four since the delta of 2026-11-23) (the 3 jobs per OS of FR-100 cost more queue than they saved), and
# macOS only nightly and by hand (`gh workflow run ui-platforms.yml --ref <branch>`); a nightly failure opens or updates an issue
# (nightly-watch.yml). Pushes to main run Linux and Windows; pull requests run Linux, and Windows only when OS-sensitive (next paragraph).
#
# Spec 117 FR-012 / O2 (owner decision, Vikram 2026-11-22, with Paco's variant; T403): on a pull request the Windows UI shards run
# only when `os_sensitive` from .github/scripts/ci-changes.js (the one decision, the base branch's copy) is not exactly 'false': a
# change to the main process, preload, build, packaging, dependencies, CI files, the driver plumbing, a font, a shell script, an
# OS-using src/shared or src/adapters file or any unknown path starts them (fail closed). Otherwise they run after the merge (main
# push), nightly and by hand (`gh workflow run ui-platforms.yml --ref <branch>` runs all three OSes on a PR's branch). The Linux UI
# shards run on every PR that needs the UI suite; ci.yml's Windows "Build and test" still runs every unit test on every PR.
#
# Spec 008 FR-191 (owner decision, Vikram 2026-11-08): on a pull request the shards run only when something the app, its build or
# the UI drivers use changed (`ui` from .github/scripts/ci-changes.js, the one decision; `paths:` below is only a coarse prefilter).
# A report or tooling script, a unit-test script or a version-only bump runs no shard, and "UI suite complete" passes saying so.
# Pushes to main, the nightly and by-hand runs always run every shard.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ui-platforms.yml'
      - '.github/scripts/ci-changes.*'
      - '.github/actions/npm-ci/**'
      - 'tsconfig.json'
      - 'build/**'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ui-platforms.yml'
      - '.github/scripts/ci-changes.*'
      - '.github/actions/npm-ci/**'
      - 'tsconfig.json'
      - 'build/**'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # FR-107: superseded PR runs are cancelled. Spec 117 FR-014 / O3 (owner decision, Vikram 2026-11-22, T010) reverses FR-107's "main
  # runs always finish" for this workflow only: every main push shares the group "UI on three OSes-ui-main", so a newer merge cancels
  # the older main UI run and only the newest main push finishes its full matrix. Nightly and by-hand runs keep their own group
  # (github.run_id) and are never cancelled.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && 'ui-main' || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  # FR-191: a cheap Linux job decides (seconds); the shards wait for it. Every event but pull_request says ui=true.
  changes:
    name: What the UI suite needs
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ui: ${{ steps.changes.outputs.ui }}
      os_sensitive: ${{ steps.changes.outputs.os_sensitive }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: bash .github/scripts/ci-changes.sh

  ui:
    # spec 008 FR-182, FR-183: every OS runs the drivers in 4 shards, named "UI shard (ubuntu-latest 1/4)" etc.;
    # the job "UI suite complete" below needs all of them and is the one name to require
    name: UI shard (${{ matrix.os }} ${{ matrix.shard }}/4)
    needs: changes
    if: ${{ !github.event.pull_request.draft && needs.changes.outputs.ui == 'true' }}
    runs-on: ${{ matrix.os }}
    # FR-131 gave macOS 80 minutes (one driver at a time, UI_SUITE_JOBS=1); it outgrew that too (nightly run 42205363015,
    # cancelled at 80 with drivers left): FR-182 split its drivers over three jobs of 45. Spec 008 delta 2026-11-23: three shards were cut at 45
    # six nights in a row with a third of the drivers never started (260 drivers, about 9,650 s one by one on macOS). macOS runs four shards; its
    # limit is what scripts/ui-shard-budget.js asks for (the slowest shard at a slow night, 1.10 x its median, plus setup, geometry, upload
    # and 12 min of npm ci retries, then 5 % margin): 70; test:uisuite fails when the two differ. Linux and Windows end in 15-22 min and keep 45
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 70 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        # FR-108: macOS nightly and by hand only; spec 117 FR-012 / O2: on a pull request Windows only unless os_sensitive is 'false'
        # (missing or any other value runs Windows: fail closed)
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest","macos-latest","windows-latest"]' || (github.event_name == 'pull_request' && needs.changes.outputs.os_sensitive == 'false') && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest"]') }}
        # FR-183: shard i of 4 runs a time-balanced quarter of the drivers (scripts/ui-suite.js --shard); macOS too since 2026-11-23 (FR-182)
        shard: [1, 2, 3, 4]
    env:
      UI_SUITE_OUT: ${{ github.workspace }}/ui-shots
      # fast checks: drivers in parallel (measured 2026-10-20 on Linux: 18/18 in 222 s at 3, against about 560 s one by one)
      # macOS runners are slow: one driver at a time and one retry, reported as FLAKY (until the drivers wait instead of sleeping)
      UI_SUITE_JOBS: ${{ matrix.os == 'macos-latest' && '1' || '3' }}
      # Windows: 3 drivers on one shared desktop lose real input now and then (spec 008 FR-138): one retry, alone, reported as FLAKY; a second failure stays a failure
      UI_SUITE_RETRY: ${{ matrix.os != 'ubuntu-latest' && '1' || '0' }}
      # FR-182, FR-183: shard i of 4 (the length of the shard list above)
      UI_SUITE_SHARD: ${{ format('{0}/4', matrix.shard) }}
      # FR-111 (owner decision 2026-10-22): theme geometry and shots-052-addleft check Clean Office and Retro on pull requests,
      # every built-in theme on main, nightly and by hand
      CHECK_ALL_THEMES: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      # FR-100/FR-108: on Linux, ci.yml's office job runs the same office layout (same script, runner image and motion) for pull
      # requests and pushes to main, so it is not run a second time here then; nightly and by hand it runs here too
      OFFICE_HERE: ${{ (matrix.os != 'ubuntu-latest' || (github.event_name != 'pull_request' && github.event_name != 'push')) && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - uses: ./.github/actions/npm-ci
      - run: npm run build
      # Theme geometry runs first in every job, every shard included: the first Electron on a fresh Linux runner failed its
      # first frame capture when a driver was first (shots-001-welcome, UnknownVizError, PR #507); after geometry it passes. Whether a
      # fresh macOS runner has the same problem is unknown, so shards 2 to 4 do not risk it (geometry is fast).
      # FR-182, FR-183: the office layout and the Mac title bar run once per OS, in shard 1 (which gets fewer drivers to make up for it)
      - name: Theme geometry
        run: node scripts/check-theme-geometry.js
      # the whole office layout, one Electron at a time (on Windows and macOS all windows share one desktop, and a covered test
      # window can stop drawing: spec 008 FR-103, PR #516)
      - name: Office layout (15 agents, 1440x900 and 1280x800)
        if: matrix.shard == 1 && env.OFFICE_HERE == '1' && (success() || failure())
        run: node scripts/check-office-overlap.js
      - name: Mac title bar
        if: matrix.shard == 1 && runner.os == 'macOS' && (success() || failure())
        run: node scripts/check-mac-titlebar.js
      - name: Simulator drivers (scripts/ui-suite.js)
        if: success() || failure()
        run: node scripts/ui-suite.js
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-shots-${{ matrix.os }}-${{ matrix.shard }}
          path: ui-shots
          retention-days: 14
          if-no-files-found: ignore

  # FR-183: the one stable name for the whole UI suite: green only when every shard of every OS passed. A skipped (draft) or cancelled
  # shard is not a pass. Branch protection can require this job instead of the shards. FR-191: when the decision said ui=false (a
  # pull request that changes nothing the UI run uses) the shards are skipped on purpose and this job passes, saying so; a failed or
  # cancelled decision job is a failure. Spec 117 O2: on a pull request with os_sensitive=false the matrix holds only the Linux shards,
  # so `needs.ui.result` is theirs alone: an intentionally absent Windows shard cannot block the PR, a Windows shard that ran and
  # failed or was cancelled fails it, and any failed, cancelled or skipped Linux shard still fails it.
  complete:
    name: UI suite complete
    if: ${{ always() && !github.event.pull_request.draft }}
    needs: [changes, ui]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every UI shard passed
        env:
          CHANGES: ${{ needs.changes.result }}
          UI_NEEDED: ${{ needs.changes.outputs.ui }}
          OS_SENSITIVE: ${{ needs.changes.outputs.os_sensitive }}
          RESULT: ${{ needs.ui.result }}
        run: |
          echo "Decision: $CHANGES (ui=$UI_NEEDED, os_sensitive=$OS_SENSITIVE); UI shards: $RESULT"
          test "$CHANGES" = "success"
          if [ "$UI_NEEDED" = "false" ]; then
            echo "Nothing the app, its build or the UI drivers use changed: the UI shards did not run (spec 008 FR-191)." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "$OS_SENSITIVE" = "false" ]; then
            echo "No OS-sensitive path changed: the Windows UI shards did not run on this pull request; they run after the merge, nightly and by hand (spec 117 FR-012)." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          test "$RESULT" = "success"
