name: UI on three OSes

# spec 008 FR-092: the simulator UI checks on macOS, Windows and Linux. The unit tests already run on all three in ci.yml; this
# adds what only ran on Linux before: theme geometry, the 15-agent office layout (1440x900 and 1280x800, with that OS's fonts),
# the Mac title bar check (on the Mac runner), and every assertion-bearing driver (`scripts/ui-suite.js`). Screenshots are
# uploaded per OS so the real Mac and Windows rendering can be looked at. Simulator only: no account, no agent session, no
# credits. Not a required check until it has been green for a while (making it required is a repo setting: the owner's call).
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ui-platforms.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ui-platforms.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-platforms-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # only superseded PR runs; main and nightly always finish (as ci.yml, #286)

jobs:
  # spec 008 FR-100: three jobs per OS instead of one (the macOS job alone took 15 min): the office layout in two halves (it already
  # shards, FR-021) and the drivers. Same checks on every OS; on Linux, pull requests and pushes to main do not run the office layout
  # a second time here, because ci.yml's office shards run it in the same event (same script, runner image and motion).
  ui:
    name: UI checks (${{ matrix.os }}, ${{ matrix.part }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        part: [layout-1, layout-2, drivers]
        exclude: ${{ fromJSON((github.event_name == 'pull_request' || github.event_name == 'push') && '[{"os":"ubuntu-latest","part":"layout-2"}]' || '[]') }}
    env:
      UI_SUITE_OUT: ${{ github.workspace }}/ui-shots
      # fast checks: drivers in parallel (measured 2026-10-20 on Linux: 18/18 in 222 s at 3, against about 560 s one by one); the macOS runner is smaller
      # macOS runners are slow: one driver at a time and one retry, reported as FLAKY (until the drivers wait instead of sleeping)
      UI_SUITE_JOBS: ${{ matrix.os == 'macos-latest' && '1' || '3' }}
      UI_SUITE_RETRY: ${{ matrix.os == 'macos-latest' && '1' || '0' }}
      OFFICE_SHARDS: '2'
      OFFICE_SHARD: ${{ matrix.part == 'layout-2' && '1' || '0' }}
      # FR-100: on Linux, ci.yml's office shards run the office layout for pull requests and pushes to main
      OFFICE_HERE: ${{ (matrix.os != 'ubuntu-latest' || (github.event_name != 'pull_request' && github.event_name != 'push')) && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npm ci
      - run: npm run build
      - name: Theme geometry
        if: matrix.part == 'layout-1'
        run: node scripts/check-theme-geometry.js
      - name: Office layout (15 agents, 1440x900 and 1280x800), half ${{ matrix.part == 'layout-2' && '2' || '1' }} of 2
        if: (matrix.part == 'layout-1' || matrix.part == 'layout-2') && env.OFFICE_HERE == '1' && (success() || failure())
        run: node scripts/check-office-overlap.js
      - name: Mac title bar
        if: runner.os == 'macOS' && matrix.part == 'layout-2' && (success() || failure())
        run: node scripts/check-mac-titlebar.js
      - name: Simulator drivers (scripts/ui-suite.js)
        if: matrix.part == 'drivers'
        run: node scripts/ui-suite.js
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-shots-${{ matrix.os }}-${{ matrix.part }}
          path: ui-shots
          retention-days: 14
          if-no-files-found: ignore
