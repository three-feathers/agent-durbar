name: UI on three OSes

# spec 008 FR-092: the simulator UI checks on macOS, Windows and Linux. The unit tests already run in ci.yml; this adds theme
# geometry, the 15-agent office layout (1440x900 and 1280x800, with that OS's fonts), the Mac title bar check (on the Mac runner)
# and every assertion-bearing driver (`scripts/ui-suite.js`). Screenshots are uploaded per OS. Simulator only: no account, no
# agent session, no credits. Not a required check (making it required is a repo setting: the owner's call).
#
# Spec 008 FR-108 (owner decision 2026-10-22): ONE job per OS, except macOS in three shards (FR-182, owner decision 2026-11-07) (the 3 jobs per OS of FR-100 cost more queue than they saved), and
# macOS only nightly and by hand (`gh workflow run ui-platforms.yml --ref <branch>`); a nightly failure opens or updates an issue
# (nightly-watch.yml). Pull requests and pushes to main run Linux and Windows.
#
# Spec 008 FR-190 (owner decision, Vikram 2026-11-08): on a pull request the shards run only when something the app, its build or
# the UI drivers use changed (`ui` from .github/scripts/ci-changes.js, the one decision; `paths:` below is only a coarse prefilter).
# A report or tooling script, a unit-test script or a version-only bump runs no shard, and "UI suite complete" passes saying so.
# Pushes to main, the nightly and by-hand runs always run every shard.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ui-platforms.yml'
      - '.github/scripts/ci-changes.*'
      - '.github/actions/npm-ci/**'
      - 'tsconfig.json'
      - 'build/**'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ui-platforms.yml'
      - '.github/scripts/ci-changes.*'
      - '.github/actions/npm-ci/**'
      - 'tsconfig.json'
      - 'build/**'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # FR-107: superseded PR runs are cancelled; main, nightly and by-hand runs each have their own group and always finish (#286)
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # FR-190: a cheap Linux job decides (seconds); the shards wait for it. Every event but pull_request says ui=true.
  changes:
    name: What the UI suite needs
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ui: ${{ steps.changes.outputs.ui }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: bash .github/scripts/ci-changes.sh

  ui:
    # spec 008 FR-182, FR-183: every OS runs the drivers in shards (Linux and Windows 4, macOS 3), named "UI shard (ubuntu-latest 1/4)" etc.;
    # the job "UI suite complete" below needs all of them and is the one name to require
    name: UI shard (${{ matrix.os }} ${{ matrix.shard }}/${{ matrix.os == 'macos-latest' && 3 || 4 }})
    needs: changes
    if: ${{ !github.event.pull_request.draft && needs.changes.outputs.ui == 'true' }}
    runs-on: ${{ matrix.os }}
    # FR-131 gave macOS 80 minutes (one driver at a time, UI_SUITE_JOBS=1); it outgrew that too (nightly run 42205363015,
    # cancelled at 80 with drivers left): FR-182 splits its drivers over three jobs instead, each about a third, so 45 for all
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # FR-108: macOS nightly and by hand only
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest","windows-latest"]') }}
        # FR-183: shard i of 4 runs a time-balanced quarter of the drivers (scripts/ui-suite.js --shard); macOS keeps 3 (FR-182)
        shard: [1, 2, 3, 4]
        exclude:
          - { os: macos-latest, shard: 4 }
    env:
      UI_SUITE_OUT: ${{ github.workspace }}/ui-shots
      # fast checks: drivers in parallel (measured 2026-10-20 on Linux: 18/18 in 222 s at 3, against about 560 s one by one)
      # macOS runners are slow: one driver at a time and one retry, reported as FLAKY (until the drivers wait instead of sleeping)
      UI_SUITE_JOBS: ${{ matrix.os == 'macos-latest' && '1' || '3' }}
      # Windows: 3 drivers on one shared desktop lose real input now and then (spec 008 FR-138): one retry, alone, reported as FLAKY; a second failure stays a failure
      UI_SUITE_RETRY: ${{ matrix.os != 'ubuntu-latest' && '1' || '0' }}
      # FR-182, FR-183: shard i of n
      UI_SUITE_SHARD: ${{ format('{0}/{1}', matrix.shard, matrix.os == 'macos-latest' && 3 || 4) }}
      # FR-111 (owner decision 2026-10-22): theme geometry and shots-052-addleft check Clean Office and Retro on pull requests,
      # every built-in theme on main, nightly and by hand
      CHECK_ALL_THEMES: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      # FR-100/FR-108: on Linux, ci.yml's office job runs the same office layout (same script, runner image and motion) for pull
      # requests and pushes to main, so it is not run a second time here then; nightly and by hand it runs here too
      OFFICE_HERE: ${{ (matrix.os != 'ubuntu-latest' || (github.event_name != 'pull_request' && github.event_name != 'push')) && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - uses: ./.github/actions/npm-ci
      - run: npm run build
      # Theme geometry runs first in every job, macOS shards 2 and 3 included: the first Electron on a fresh Linux runner failed its
      # first frame capture when a driver was first (shots-001-welcome, UnknownVizError, PR #507); after geometry it passes. Whether a
      # fresh macOS runner has the same problem is unknown, so shards 2 and 3 do not risk it (geometry is fast).
      # FR-182, FR-183: the office layout and the Mac title bar run once per OS, in shard 1 (which gets fewer drivers to make up for it)
      - name: Theme geometry
        run: node scripts/check-theme-geometry.js
      # the whole office layout, one Electron at a time (on Windows and macOS all windows share one desktop, and a covered test
      # window can stop drawing: spec 008 FR-103, PR #516)
      - name: Office layout (15 agents, 1440x900 and 1280x800)
        if: matrix.shard == 1 && env.OFFICE_HERE == '1' && (success() || failure())
        run: node scripts/check-office-overlap.js
      - name: Mac title bar
        if: matrix.shard == 1 && runner.os == 'macOS' && (success() || failure())
        run: node scripts/check-mac-titlebar.js
      - name: Simulator drivers (scripts/ui-suite.js)
        if: success() || failure()
        run: node scripts/ui-suite.js
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-shots-${{ matrix.os }}-${{ matrix.shard }}
          path: ui-shots
          retention-days: 14
          if-no-files-found: ignore

  # FR-183: the one stable name for the whole UI suite: green only when every shard of every OS passed. A skipped (draft) or cancelled
  # shard is not a pass. Branch protection can require this job instead of the shards. FR-190: when the decision said ui=false (a
  # pull request that changes nothing the UI run uses) the shards are skipped on purpose and this job passes, saying so; a failed or
  # cancelled decision job is a failure.
  complete:
    name: UI suite complete
    if: ${{ always() && !github.event.pull_request.draft }}
    needs: [changes, ui]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every UI shard passed
        env:
          CHANGES: ${{ needs.changes.result }}
          UI_NEEDED: ${{ needs.changes.outputs.ui }}
          RESULT: ${{ needs.ui.result }}
        run: |
          echo "Decision: $CHANGES (ui=$UI_NEEDED); UI shards: $RESULT"
          test "$CHANGES" = "success"
          if [ "$UI_NEEDED" = "false" ]; then
            echo "Nothing the app, its build or the UI drivers use changed: the UI shards did not run (spec 008 FR-190)." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test "$RESULT" = "success"
