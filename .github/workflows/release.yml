name: Release

# Push a tag like v0.1.0-alpha.1 on a commit of main (it must match "version" in package.json: a version-only PR lands first).
# The verify job refuses any other tag and writes the release notes from exactly the tagged commit's changelog.d/ fragments
# (spec 008 FR-117..FR-120: fold at tag time, so no release PR has to fold them and go stale while the queue lands more).
# Builds UNSIGNED packages on macOS, Windows and Linux and attaches them to a DRAFT. A tag with a "-" in the version (alpha, beta,
# rc, every -test.M) is a pre-release, never latest. A stable tag (v1.2.3) is a draft that is NOT a pre-release; GitHub keeps no
# "latest" mark on a draft, so the owner publishes it by hand with the command printed in the job summary (a
# "--draft=false --latest" edit). The choice is made once, by releaseKind() in scripts/release-notes.js (spec 008 FR-129); verify passes it on as outputs.
# Nothing is published automatically: review the draft and publish it by hand. Nothing here pushes to any branch: the fold
# into CHANGELOG.md is a normal doc-only PR afterwards (changelog.d/README.md).
# Test builds (spec 008 FR-121..FR-124): a tag vX.Y.Z[-alpha|beta|rc.N]-test.M may be on any branch; package.json must be the tag
# without -test.M. Its draft is titled "(test build)", its notes list the commits not on main (masked), and nothing is folded.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Check the tag and write the release notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.notes.outputs.prerelease }}
      latest: ${{ steps.notes.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every branch and tag: the tag must be on main, and the previous release tag is looked up
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Plain Node and git: no dependency install (no package code runs here), no token, no network.
      - name: Tag on main (or a -test.N tag), matching package.json; notes and title from the tagged commit
        id: notes
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: node scripts/release-notes.js --tag "$TAG" --repo "$REPO" --main-ref refs/remotes/origin/main --out release-notes.md --title-out release-title.txt --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: |
            release-notes.md
            release-title.txt
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build (${{ matrix.name }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60 # spec 008 FR-110; the slowest build (macOS, both architectures) took 5 min on alpha.10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            # Separate runs per architecture: each bundle carries only its own Copilot runtime.
            commands: npm run dist:mac:arm64 && npm run dist:mac:x64
            artifacts: |
              release/*.dmg
              release/*.zip
          - name: Windows
            os: windows-latest
            commands: npm run dist:win
            artifacts: |
              release/*.exe
          - name: Linux
            os: ubuntu-latest
            commands: npm run dist:linux
            artifacts: |
              release/*.AppImage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Package (unsigned, no publishing)
        shell: bash
        env:
          # Make sure electron-builder never looks for signing identities or publishes anything.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: ${{ matrix.commands }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-durbar-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Draft release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [verify, build]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: agent-durbar-*
          path: dist-artifacts
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: Checksums
        run: |
          cd dist-artifacts
          sha256sum * > SHA256SUMS.txt
          ls -la
      # Always a DRAFT (owner decision). verify decides pre-release or not (releaseKind: a "-" in the version is a pre-release); a
      # pre-release is created --latest=false, a stable one is left without --latest because the API keeps no "latest" on a draft:
      # the owner publishes it by hand with the command in the job summary. verify writes the title ("(test build)" for a
      # test tag). An existing release only gets its files replaced, so notes the release manager edited on the draft are kept, and
      # only while it is still a draft: a published release is never touched.
      - name: Create or update DRAFT release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          LATEST: ${{ needs.verify.outputs.latest }}
        run: |
          TITLE="$(cat notes/release-title.txt)" # bash -e: a missing title file stops the job
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" != "true" ]; then
              echo "Release $TAG is already published: its files are not replaced (spec 008 FR-120)" >&2
              exit 1
            fi
            gh release upload "$TAG" dist-artifacts/* --clobber
          else
            # only the two values verify writes are accepted; anything else stops the job (bash -e), nothing is guessed
            if [ "$PRERELEASE" = "true" ] && [ "$LATEST" = "false" ]; then
              KIND=(--prerelease --latest=false)
            elif [ "$PRERELEASE" = "false" ] && [ "$LATEST" = "true" ]; then
              KIND=() # stable: still a draft; "latest" is set when the owner publishes it
            else
              echo "verify gave no release kind (prerelease=$PRERELEASE latest=$LATEST)" >&2
              exit 1
            fi
            gh release create "$TAG" dist-artifacts/* --draft "${KIND[@]}" --verify-tag \
              --title "$TITLE" --notes-file notes/release-notes.md
          fi
