name: Release

# Push a tag like v0.1.0-alpha.1 (it must match "version" in package.json).
# Builds UNSIGNED packages on macOS, Windows and Linux and attaches them to a DRAFT release.
# Nothing is published automatically: review the draft and publish it by hand.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60 # spec 008 FR-110; the slowest build (macOS, both architectures) took 5 min on alpha.10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            # Separate runs per architecture: each bundle carries only its own Copilot runtime.
            commands: npm run dist:mac:arm64 && npm run dist:mac:x64
            artifacts: |
              release/*.dmg
              release/*.zip
          - name: Windows
            os: windows-latest
            commands: npm run dist:win
            artifacts: |
              release/*.exe
          - name: Linux
            os: ubuntu-latest
            commands: npm run dist:linux
            artifacts: |
              release/*.AppImage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Tag must match package.json version
        shell: bash
        run: |
          v="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${v}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v${v}" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Package (unsigned, no publishing)
        shell: bash
        env:
          # Make sure electron-builder never looks for signing identities or publishes anything.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: ${{ matrix.commands }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-durbar-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Draft release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist-artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist-artifacts
          sha256sum * > SHA256SUMS.txt
          ls -la
      - name: Create or update DRAFT pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          flags="--draft"
          case "$TAG" in *-*) flags="$flags --prerelease";; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-artifacts/* --clobber
          else
            gh release create "$TAG" dist-artifacts/* $flags --verify-tag --title "Agent Durbar $TAG" \
              --notes "Unsigned alpha build of Agent Durbar. Not code-signed or notarized: see the README for the macOS Gatekeeper and Windows SmartScreen steps. Requires GitHub Copilot (copilot login). Independent project, not affiliated with GitHub or Microsoft."
          fi
