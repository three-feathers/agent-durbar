name: Release

# Push a tag like v0.1.0-alpha.1 on a commit of main (it must match "version" in package.json: a version-only PR lands first).
# The verify job refuses any other tag and writes the release notes from exactly the tagged commit's changelog.d/ fragments
# (spec 008 FR-117..FR-120: fold at tag time, so no release PR has to fold them and go stale while the queue lands more).
# Builds UNSIGNED packages on macOS, Windows and Linux and attaches them to a DRAFT pre-release, never marked latest.
# Nothing is published automatically: review the draft and publish it by hand. Nothing here pushes to any branch: the fold
# into CHANGELOG.md is a normal doc-only PR afterwards (changelog.d/README.md).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Check the tag and write the release notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every branch and tag: the tag must be on main, and the previous release tag is looked up
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Plain Node and git: no dependency install (no package code runs here), no token, no network.
      - name: Tag on main, matching package.json; notes from the tagged commit
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: node scripts/release-notes.js --tag "$TAG" --repo "$REPO" --main-ref origin/main --out release-notes.md --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build (${{ matrix.name }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60 # spec 008 FR-110; the slowest build (macOS, both architectures) took 5 min on alpha.10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            # Separate runs per architecture: each bundle carries only its own Copilot runtime.
            commands: npm run dist:mac:arm64 && npm run dist:mac:x64
            artifacts: |
              release/*.dmg
              release/*.zip
          - name: Windows
            os: windows-latest
            commands: npm run dist:win
            artifacts: |
              release/*.exe
          - name: Linux
            os: ubuntu-latest
            commands: npm run dist:linux
            artifacts: |
              release/*.AppImage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Package (unsigned, no publishing)
        shell: bash
        env:
          # Make sure electron-builder never looks for signing identities or publishes anything.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: ${{ matrix.commands }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-durbar-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Draft release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [verify, build]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: agent-durbar-*
          path: dist-artifacts
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: Checksums
        run: |
          cd dist-artifacts
          sha256sum * > SHA256SUMS.txt
          ls -la
      # Always a draft pre-release, never "latest" (owner decision). An existing release only gets its files replaced, so notes
      # the release manager edited on the draft are kept.
      - name: Create or update DRAFT pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-artifacts/* --clobber
          else
            gh release create "$TAG" dist-artifacts/* --draft --prerelease --latest=false --verify-tag \
              --title "Agent Durbar $TAG" --notes-file notes/release-notes.md
          fi
