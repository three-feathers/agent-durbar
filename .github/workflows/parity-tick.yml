name: Parity tick

# Spec 021 FR-088 (owner request, Vikram, 2026-11-09): the parity checklists tick themselves. When an issue is closed as completed,
# `- [ ] #N` becomes `- [x] #N` in each tracker issue listed in .github/parity-trackers.json; when it is reopened, the line is
# unticked. No AI call, secret or third-party action: scripts/parity-tick.js uses the GITHUB_TOKEN through the preinstalled gh
# without a shell. An `issues` event always runs main's workflow and code (never a PR's). Event values reach the script only as
# quoted env values (number, action, close reason, two logins); titles, bodies and labels of the event are never used.
on:
  issues:
    types: [closed, reopened]

permissions:
  issues: write
  contents: read

concurrency:
  group: parity-tick
  cancel-in-progress: false

jobs:
  tick:
    name: Tick the parity checklists
    if: ${{ !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tick or untick the line
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EVENT_ACTION: ${{ github.event.action }}
          STATE_REASON: ${{ github.event.issue.state_reason }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ACTOR: ${{ github.event.sender.login }}
        run: node scripts/parity-tick.js
