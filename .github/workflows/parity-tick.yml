name: Parity tick

# Spec 021 FR-088 (owner request, Vikram, 2026-11-09): the parity checklists tick themselves. Every run reconciles each tracker
# issue in .github/parity-trackers.json with the live state of the issues its `- [ ] #M` lines name: closed as completed by or
# for a trusted account => `[x]`, open => `[ ]`, anything else unchanged. GitHub keeps only one pending run per concurrency
# group (a newer one cancels it), so runs do not act on "the issue that triggered me": the next run does a cancelled run's work.
# Triggers: an issue closed or reopened, by hand, and a daily backstop. No value of the event is used; no AI call, secret or
# third-party action. An `issues` event always runs main's workflow and code (never a PR's); a PR close is a pull_request
# event and does not start this workflow. scripts/parity-tick.js uses the GITHUB_TOKEN through the preinstalled gh, no shell.
on:
  issues:
    types: [closed, reopened]
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * *'

permissions:
  issues: write
  contents: read

concurrency:
  group: parity-tick
  cancel-in-progress: false

jobs:
  tick:
    name: Reconcile the parity checklists
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tick and untick the lines
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/parity-tick.js
