name: Bug
description: Something is wrong. A fix is a spec delta first (a dated entry under ## Changes in the owning spec).
labels: ["bug"]
body:
  - type: input
    id: spec
    attributes:
      label: Owning spec
      description: e.g. `specs/005-chat-fullscreen-and-agent-strip` (best guess is fine)
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Prefer the simulator (`DURBAR_SIM=15 npm start`). Do not paste tokens, `.env` or session data.
  - type: input
    id: env
    attributes:
      label: OS
      description: macOS / Windows / Linux (the Agent Durbar version goes in its own field below)
  - type: dropdown
    id: deployment
    attributes:
      label: Where did you observe this?
      description: Choose Unknown if you are not sure. Do not include tokens, secrets, or session data.
      options:
        - Unknown / not applicable
        - Published user-facing release
        - Development or main build
        - CI, simulator, or test build (a -test tag)
  - type: input
    id: release
    attributes:
      label: Agent Durbar version or release tag
      description: e.g. v0.1.0-alpha.14; leave blank if unknown
  - type: textarea
    id: impact
    attributes:
      label: User impact and workaround
      description: Who or what was affected? Was there a workaround or urgent mitigation?
  - type: dropdown
    id: intervention
    attributes:
      label: Was immediate intervention needed?
      description: For example, a rollback, hotfix, or urgent mitigation. Choose Unknown if unsure.
      options:
        - Unknown / not applicable
        - Yes
        - No
