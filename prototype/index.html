<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Command Center - Prototype (sample data)</title>
<style>
:root{
  --bg:#f6f3ee; --surface:#fffdf9; --surface-2:#faf7f1; --line:#e2dbcf; --line-2:#d3cabb;
  --ink:#2c3733; --ink-2:#56605b; --muted:#6a716c;
  --sage:#8fb09a; --sage-ink:#3f6a54; --blue:#6f93b5; --blue-ink:#34607f;
  --amber:#d9962b; --amber-ink:#80530a; --red:#bf5a50; --red-ink:#8e3a32; --green:#5f9a76; --gray:#9b978d;
  --c-working:#6f93b5; --c-thinking:#8a97bd; --c-waiting:#d9962b; --c-idle:#a29e94; --c-error:#bf5a50; --c-done:#5f9a76;
  --radius:16px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --unit:164px; --helper:90px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.4;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #4f7fa8;outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- top bar ---------- */
.topbar{height:64px;flex:none;display:flex;align-items:center;gap:20px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{width:34px;height:34px;border-radius:10px;background:#e4ece6;display:grid;place-items:center;flex:none}
.brand h1{margin:0;font-size:16px;line-height:1.15;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
.proto{display:inline-block;margin-top:3px;font-size:11px;font-weight:600;color:var(--amber-ink);background:#fbefd6;border:1px solid #f0d9a6;border-radius:999px;padding:1px 8px;white-space:nowrap}
.stats{display:flex;gap:8px;margin-left:auto}
.stat{display:flex;align-items:center;gap:7px;height:36px;padding:0 12px 0 10px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s}
.stat:hover{border-color:var(--line-2);background:#fff}
.stat[aria-pressed="true"]{background:#fff;border-color:#8aa7be;box-shadow:0 0 0 2px #dde8f1}
.stat b{font-size:15px;font-weight:650;font-variant-numeric:tabular-nums}
.stat span.l{font-size:12.5px;color:var(--ink-2)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--gray);flex:none;display:inline-block}
.dot.working{background:var(--c-working)} .dot.thinking{background:var(--c-thinking)} .dot.waiting{background:var(--c-waiting)}
.dot.idle{background:transparent;border:2px solid var(--c-idle)} .dot.error{background:var(--c-error)} .dot.done{background:var(--c-done)}
.controls{display:flex;align-items:center;gap:12px}
.select-wrap{position:relative}
.select-wrap select{appearance:none;height:36px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:0 32px 0 12px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer;max-width:190px}
.select-wrap::after{content:"";position:absolute;right:12px;top:14px;width:6px;height:6px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);pointer-events:none}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{height:28px;padding:0 12px;border:0;background:transparent;border-radius:7px;font-size:13px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(60,50,30,.12)}

/* ---------- workspace ---------- */
.workspace{flex:1;display:flex;min-height:0}
#floor{flex:1;min-width:0;position:relative;overflow:hidden;padding:16px 24px 20px}
#stage{transform-origin:0 0;display:flex;flex-wrap:wrap;gap:14px;align-content:stretch;align-items:stretch}
.room{flex:var(--w) 1 calc(var(--w)*1px);min-width:var(--min);display:flex;flex-direction:column;border-radius:22px;border:2px solid var(--wall);background:var(--tint);padding:12px 16px 14px;position:relative}
.room[data-tint="sage"]{--tint:#e9f0e8;--wall:#cfdccf}
.room[data-tint="blue"]{--tint:#e8eef3;--wall:#ccd9e3}
.room[data-tint="sand"]{--tint:#f2ecdf;--wall:#ddd2bc}
.room[data-tint="clay"]{--tint:#f3e9e3;--wall:#e1cfc5}
.room-head{display:flex;align-items:center;gap:10px;min-height:34px}
.room-name{font-size:14px;font-weight:650;letter-spacing:-.005em}
.room-path{font-size:12px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.room-dots{margin-left:auto;display:flex;gap:9px;align-items:center;padding-right:32px}
.rd{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--ink-2)}
.room-plant{position:absolute;right:12px;top:6px}
.units{flex:1;margin:2px 0 0;display:flex;flex-wrap:wrap;justify-content:space-evenly;align-content:center;gap:10px 6px;padding:16px 6px 14px;background:rgba(255,255,255,.38);border-radius:22px}
.unit{display:flex;align-items:flex-start;position:relative}
.desk{width:var(--unit);padding:4px 4px 10px;border:1.5px solid transparent;border-radius:var(--radius);background:rgba(255,253,249,.72);cursor:pointer;text-align:left;position:relative;transition:background .15s,border-color .15s,box-shadow .15s,transform .15s;display:block}
.desk:hover{background:var(--surface);border-color:var(--line-2);transform:translateY(-1px)}
.desk[aria-pressed="true"]{background:var(--surface);border-color:#7fa0bd;box-shadow:0 0 0 3px #d9e6f0}
.scene{display:block;width:100%;height:auto;overflow:visible}
.helper .scene{overflow:hidden}
.desk .badge{position:absolute;top:10px;right:10px}
.badge{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;background:var(--bd,var(--gray));box-shadow:0 0 0 3px rgba(255,253,249,.9)}
.badge.working{--bd:var(--c-working)} .badge.thinking{--bd:var(--c-thinking)} .badge.waiting{--bd:var(--c-waiting)}
.badge.idle{--bd:#bdb9af} .badge.error{--bd:var(--c-error)} .badge.done{--bd:var(--c-done)}
.badge.waiting::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--c-waiting);opacity:0;animation:ping 2.8s ease-out infinite}
.badge svg{width:10px;height:10px;display:block}
.desk .info{padding:2px 8px 0}
.who{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.name{font-weight:650;font-size:14px}
.role{font-size:11.5px;color:var(--muted)}
.task{margin:3px 0 7px;font-size:12px;color:var(--ink-2);line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:48px}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px 0 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--pb);color:var(--pc)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--pd)}
.st-working{--pb:#e3ecf4;--pc:#2f5a7a;--pd:var(--c-working)} .st-thinking{--pb:#e8eaf3;--pc:#434f7a;--pd:var(--c-thinking)}
.st-waiting{--pb:#fbefd6;--pc:var(--amber-ink);--pd:var(--c-waiting)} .st-idle{--pb:#ece9e2;--pc:#5c5f59;--pd:var(--c-idle)}
.st-error{--pb:#f6e2df;--pc:var(--red-ink);--pd:var(--c-error)} .st-done{--pb:#e0eee6;--pc:#2f6a47;--pd:var(--c-done)}
.st-idle i{background:transparent;border:1.5px solid var(--c-idle)}
.desk.is-idle .scene,.desk.is-idle .info,.helper.is-idle .scene,.helper.is-idle .hinfo{opacity:.68}

.helpers{width:calc(var(--helper) + 14px);padding-left:14px;display:flex;flex-direction:column;gap:6px;position:relative;margin-left:-2px}
.links{position:absolute;left:-6px;top:0;width:24px;height:100%;pointer-events:none;overflow:visible}
.helper{width:var(--helper);border:1.5px solid transparent;background:rgba(255,253,249,.72);border-radius:12px;padding:3px 2px 6px;cursor:pointer;text-align:left;position:relative;transition:background .15s,border-color .15s;display:block}
.helper:hover{background:var(--surface);border-color:var(--line-2)}
.helper[aria-pressed="true"]{background:var(--surface);border-color:#7fa0bd;box-shadow:0 0 0 3px #d9e6f0}
.helper .badge{position:absolute;top:4px;right:4px;width:12px;height:12px;box-shadow:0 0 0 2px rgba(255,253,249,.9)}
.helper .badge svg{width:7px;height:7px}
.hinfo{padding:0 4px}
.hname{font-size:11.5px;font-weight:650;line-height:1.2}
.hrole{font-size:10.5px;color:var(--muted);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hst{display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--ink-2);margin-top:2px;white-space:nowrap}
.hst .dot{width:7px;height:7px}
.empty{padding:60px;text-align:center;color:var(--muted);width:100%}

/* scene animation (subtle) */
.scene *{transform-box:fill-box}
.bar{transform-origin:left center;animation:bar 3.4s ease-in-out infinite alternate}
.bar:nth-of-type(2){animation-duration:2.7s;animation-delay:-.8s}
.bar:nth-of-type(3){animation-duration:4s;animation-delay:-1.6s}
.bar:nth-of-type(4){animation-duration:3.1s;animation-delay:-2.2s}
@keyframes bar{from{transform:scaleX(.55)}to{transform:scaleX(1)}}
.glow{animation:glow 3.6s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.16}to{opacity:.34}}
.hand-l{animation:tap .46s ease-in-out infinite alternate}
.hand-r{animation:tap .58s ease-in-out -.2s infinite alternate}
@keyframes tap{from{transform:translateY(0)}to{transform:translateY(-1.8px)}}
.head{transform-origin:50% 90%;animation:nod 5s ease-in-out infinite}
@keyframes nod{0%,100%{transform:rotate(0)}50%{transform:rotate(1.6deg)}}
.bubble-g{animation:floaty 4.2s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.td{animation:dotp 1.8s ease-in-out infinite}
.td:nth-child(2){animation-delay:.3s}.td:nth-child(3){animation-delay:.6s}
@keyframes dotp{0%,100%{opacity:.25}40%{opacity:1}}
.steam{animation:steam 3.6s ease-in-out infinite}
.steam:nth-child(2){animation-delay:-1.8s}
@keyframes steam{0%{opacity:0;transform:translateY(3px)}40%{opacity:.7}100%{opacity:0;transform:translateY(-4px)}}
@keyframes ping{0%{opacity:.7;transform:scale(.8)}70%,100%{opacity:0;transform:scale(1.6)}}
@keyframes blink{50%{opacity:.2}}

/* ---------- list view ---------- */
#list{flex:1;min-width:0;overflow:auto;padding:16px 24px 20px;display:none}
.list-wrap{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.lrow{display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(110px,.8fr) minmax(120px,.9fr) minmax(200px,2.6fr) 138px;gap:14px;align-items:center;width:100%;padding:0 18px;height:44px;border:0;border-bottom:1px solid #eee8dd;background:transparent;text-align:left;cursor:pointer;font-size:13px}
.lrow:last-child{border-bottom:0}
button.lrow:hover{background:var(--surface-2)}
button.lrow[aria-pressed="true"]{background:#eaf1f7}
.lrow.head{height:36px;cursor:default;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;background:var(--surface-2);font-weight:600}
.lname{display:flex;align-items:center;gap:10px;font-weight:600;min-width:0}
.lname .sub{margin-left:12px;font-weight:550}
.lname .sub::before{content:"";display:inline-block;width:10px;height:10px;border-left:1.5px solid var(--line-2);border-bottom:1.5px solid var(--line-2);margin-right:6px;transform:translateY(-3px);border-radius:0 0 0 4px}
.lcell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.lcell.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
#stage-host{display:contents}
body.list-mode #stage-host{display:none}
body.list-mode #list{display:block}

/* ---------- panel ---------- */
#panel{width:400px;flex:none;background:var(--surface);border-left:1px solid var(--line);display:none;flex-direction:column;min-height:0}
body.panel-open #panel{display:flex}
.panel-in{display:flex;flex-direction:column;min-height:0;height:100%;animation:slide .28s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.ph{padding:18px 20px 14px;border-bottom:1px solid var(--line);position:relative}
.ph-top{display:flex;gap:14px;align-items:center}
.avatar{width:52px;height:52px;border-radius:50%;background:#e7eee8;overflow:hidden;flex:none}
.ph h2{margin:0;font-size:18px;line-height:1.2;letter-spacing:-.01em}
.ph h2:focus{outline:none}
.ph h2:focus-visible{outline:3px solid #4f7fa8}
.ph .sub{font-size:12.5px;color:var(--muted)}
.ph-meta{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.folder{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px 8px}
.close{position:absolute;right:14px;top:14px;width:32px;height:32px;border-radius:10px;border:1px solid transparent;background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--ink-2)}
.close:hover{background:var(--surface-2);border-color:var(--line)}
.ptask{margin:10px 0 0;font-size:13px;color:var(--ink-2)}
.actions{display:flex;gap:8px;margin-top:14px}
.btn{height:34px;padding:0 14px;border-radius:10px;border:1px solid var(--line-2);background:#fff;cursor:pointer;font-size:13px;font-weight:550;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{background:var(--surface-2);border-color:#bdb3a2}
.btn.primary{background:#e4ede6;border-color:#bcd0c1;color:#2c5640}
.btn.primary:hover{background:#d9e6dc}
.btn.danger{color:var(--red-ink)}
.btn.danger:hover{background:#f9ecea;border-color:#e2bcb7}
.btn svg{width:15px;height:15px;flex:none}
#chat{flex:1;min-height:0;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}
.chat-inner{display:flex;flex-direction:column;gap:16px}
.msg{display:flex;flex-direction:column;gap:7px;max-width:100%}
.msg.user{align-items:flex-end}
.msg .meta{font-size:11.5px;color:var(--muted)}
.bubble{padding:10px 14px;border-radius:16px;font-size:13.5px;line-height:1.5;max-width:92%;white-space:pre-wrap;word-wrap:break-word}
.msg.user .bubble{background:#e3ecf4;color:#1f3b52;border-bottom-right-radius:6px}
.msg.agent .bubble{background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:6px;align-self:flex-start}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{height:30px;padding:0 12px;border-radius:999px;border:1px solid #e3c98f;background:#fdf5e3;color:var(--amber-ink);font-size:12.5px;font-weight:550;cursor:pointer}
.quick button:hover{background:#faecc9}
.think{border:1px solid var(--line);border-radius:12px;background:#fbf9f4;overflow:hidden}
.think-toggle{width:100%;display:flex;align-items:center;gap:8px;padding:8px 12px;border:0;background:transparent;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-2);text-align:left}
.think-toggle:hover{background:#f5f1e8}
.think-toggle .chev{width:12px;height:12px;transition:transform .2s;flex:none}
.think-toggle[aria-expanded="true"] .chev{transform:rotate(90deg)}
.think-toggle .live{margin-left:auto;display:none;gap:3px}
.think.streaming .live{display:inline-flex}
.live i{width:4px;height:4px;border-radius:50%;background:var(--c-thinking);animation:dotp 1.4s infinite}
.live i:nth-child(2){animation-delay:.2s}.live i:nth-child(3){animation-delay:.4s}
.think-body{padding:0 12px 11px 32px;font-size:12.5px;color:var(--ink-2);line-height:1.55;white-space:pre-wrap;font-style:italic}
.think-body[hidden]{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;max-width:100%;height:28px;padding:0 10px 0 8px;border-radius:9px;background:#eef2f0;border:1px solid #d7e0da;font-size:12px;color:var(--ink-2);animation:pop .25s ease-out}
.chip svg{width:13px;height:13px;flex:none}
.chip b{font-weight:600;color:var(--ink)}
.chip code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .res{font-size:11.5px;padding-left:6px;border-left:1px solid #cfd8d2;color:var(--sage-ink);font-weight:600;white-space:nowrap}
.chip.fail{background:#f8e8e5;border-color:#ebc7c2}.chip.fail .res{color:var(--red-ink);border-color:#e3bdb7}
.chip.run .res{color:var(--blue-ink)}
@keyframes pop{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.typing{display:inline-flex;gap:4px;padding:4px 2px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--c-thinking);animation:dotp 1.4s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
.caret::after{content:"";display:inline-block;width:2px;height:1em;background:var(--ink-2);margin-left:2px;vertical-align:-2px;animation:blink 1s step-end infinite}
.composer{border-top:1px solid var(--line);padding:12px 16px 14px;background:var(--surface)}
.attached{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.attached:empty{display:none}
.att{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 4px 0 9px;border-radius:8px;background:#e8eef4;border:1px solid #cfdbe6;font-size:12px;color:#2f526e}
.att.img{background:#eef2e8;border-color:#d6e0c9;color:#46602f}
.att svg{width:13px;height:13px}
.att button{width:20px;height:20px;border:0;background:transparent;border-radius:6px;cursor:pointer;display:grid;place-items:center;color:inherit}
.att button:hover{background:rgba(0,0,0,.07)}
.inbox{display:flex;align-items:flex-end;gap:4px;border:1px solid var(--line-2);border-radius:14px;background:#fff;padding:6px}
.inbox:focus-within{border-color:#7fa0bd;box-shadow:0 0 0 3px #dbe7f1}
.inbox textarea{flex:1;border:0;outline:0;resize:none;font:inherit;font-size:13.5px;padding:7px 6px;min-height:36px;max-height:110px;background:transparent;color:var(--ink)}
.ib{width:34px;height:34px;border-radius:10px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--ink-2);flex:none}
.ib:hover{background:var(--surface-2)}
.ib svg{width:18px;height:18px}
.send{background:#5f8aa8;color:#fff;margin-left:4px}
.send:hover{background:#507b99}
.send[aria-disabled="true"]{background:#c9d3da;cursor:not-allowed}
.hint{font-size:11.5px;color:var(--muted);margin:7px 2px 0}

/* toast */
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:50;pointer-events:none}
.toast{background:#2f3a36;color:#f7f4ee;padding:10px 16px;border-radius:12px;font-size:13px;box-shadow:0 8px 24px rgba(40,35,25,.18);animation:pop .25s ease-out;max-width:560px}
.toast code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:rgba(255,255,255,.14);padding:1px 6px;border-radius:6px}

@media (max-width:1320px){
  .topbar{gap:14px;padding:0 18px}
  .stat{padding:0 10px 0 8px}.stat span.l{font-size:12px}
  .seg button{padding:0 10px}
  .select-wrap select{max-width:160px}
  #floor{padding:12px 16px 16px}
  #panel{width:400px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs><filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter></defs></svg>

<header class="topbar">
  <div class="brand">

function visibleAgents(){return agents.filter(a=>(ui.ws==='all'||wsOf(a)===ui.ws));}
function renderStats(){
  const list=visibleAgents(); const c={working:0,waiting:0,idle:0,error:0,done:0};
  list.forEach(a=>{const s=vis(a); if(s==='working'||s==='thinking')c.working++; else c[s]++;});
  const defs=[['working','Working','working or thinking'],['waiting','Waiting','waiting for you'],['idle','Idle','idle or paused'],['error','Errors','with errors'],['done','Done','done']];

function renderOffice(){
  const stage=document.getElementById('stage'); let html='';
  const U=164, HW=90+14+12;
  ROOMS.forEach(r=>{
    if(ui.ws!=='all'&&ui.ws!==r.id)return;
    const mains=agents.filter(a=>!a.parent&&a.room===r.id&&(matchStatus(a)||agents.some(h=>h.parent===a.id&&matchStatus(h))));
    if(!mains.length)return;
    const all=agents.filter(a=>wsOf(a)===r.id);
    const widths=mains.map(a=>U+(agents.some(h=>h.parent===a.id)?HW:0)+8);
    const basis=widths.reduce((x,y)=>x+y,0)+40;
    const min=Math.max(...widths)+40;
    const dots=['working','waiting','error','done','idle'].map(k=>{const n=all.filter(a=>{const s=vis(a);return k==='working'?(s==='working'||s==='thinking'):s===k}).length;return n?`<span class="rd" title="${n} ${LABELS[k]}"><span class="dot ${k}"></span>${n}</span>`:''}).join('');
    html+=`<section class="room" data-tint="${r.tint}" style="--w:${basis};--min:${min}px" aria-label="Workspace ${r.name}">
      <div class="room-head"><span class="room-name">${r.name}</span><span class="room-path">${r.path}</span><span class="room-dots" aria-hidden="true">${dots}</span>${PLANT}</div>
      <div class="units">${mains.map(unitHTML).join('')}</div></section>`;
  });
  stage.innerHTML=html||'<div class="empty">No agents match these filters.</div>';
  fit();
}
function fit(){
  if(ui.view!=='office')return;
  const floor=document.getElementById('floor'), stage=document.getElementById('stage');
  const cs=getComputedStyle(floor);
  const aw=floor.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const ah=floor.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  if(aw<=0||ah<=0)return;
  let s=1, ok=false;
  stage.style.transform='none';
  for(s=1.3;s>=0.5;s-=0.02){
    stage.style.width=(aw/s)+'px'; stage.style.height='auto';
    if(stage.scrollHeight*s<=ah){ok=true;break;}
  }
  if(!ok)s=0.5;
  stage.style.width=(aw/s)+'px'; stage.style.height='auto';
  const nat=stage.scrollHeight;
  stage.style.height=Math.max(nat, ah/s)+'px';
  stage.style.transform=`scale(${s})`;
  stage.dataset.scale=s.toFixed(2);
}

function renderList(){

      if(matchStatus(a)||subs.some(matchStatus)){rows.push([a,false]);subs.forEach(h=>rows.push([h,true]));}

  const row=([a,sub])=>{const st=vis(a);return `<button class="lrow" data-id="${a.id}" aria-pressed="${ui.selected===a.id}" aria-label="${esc(a.name)}, ${esc(a.role)}, ${esc(roomOf(a).name)}, ${label(a)}: ${esc(a.task)}">

/* ---------------- panel + chat ---------------- */
const chats={};
const sleep=ms=>new Promise(r=>setTimeout(r,REDUCED?0:ms));
function scrollChat(chat){const c=document.getElementById('chat'); if(c&&chat.el.parentNode===c){c.scrollTop=c.scrollHeight;}}
async function typeInto(el,text,speed,chat){
  if(REDUCED){el.textContent=text;return;}
  for(let i=0;i<text.length;){i+=2+Math.floor(Math.random()*3);el.textContent=text.slice(0,i);scrollChat(chat);await sleep(speed);}
  el.textContent=text;
}
function chipHTML(t){const [k,l,res,rs]=t;return `<span class="chip ${rs==='fail'?'fail':rs==='run'?'run':''}" title="${TOOLNAME[k]}: ${esc(l)}${res?' ('+esc(res)+')':''}">${ICON[k]}<b>${TOOLNAME[k]}</b><code>${esc(l)}</code>${res?`<span class="res">${rs==='fail'?'Failed: ':''}${esc(res)}</span>`:''}</span>`}
function newAgentMsg(chat,a){
  const m=document.createElement('div');m.className='msg agent';
  m.innerHTML=`<div class="meta">${esc(a.name)}</div><div class="think streaming"><button class="think-toggle" aria-expanded="true">${ICON.chev}<span>Thinking</span><span class="live" aria-hidden="true"><i></i><i></i><i></i></span></button><div class="think-body"></div></div><div class="chips" aria-label="Tool calls"></div>`;
  const tb=m.querySelector('.think-toggle'),body=m.querySelector('.think-body');
  tb.addEventListener('click',()=>{const o=tb.getAttribute('aria-expanded')==='true';tb.setAttribute('aria-expanded',String(!o));body.hidden=o;});
  chat.el.appendChild(m);scrollChat(chat);return m;
}
async function playTurn(chat,a,turn,opts){
  opts=opts||{};
  const m=newAgentMsg(chat,a), body=m.querySelector('.think-body'), chips=m.querySelector('.chips'), think=m.querySelector('.think');
  await typeInto(body,turn.think,16,chat);
  think.classList.remove('streaming');
  for(const t of turn.tools){await sleep(380);const d=document.createElement('div');d.innerHTML=chipHTML(t);chips.appendChild(d.firstChild);scrollChat(chat);}
  if(turn.reply){
    await sleep(350);
    const b=document.createElement('div');b.className='bubble caret';m.appendChild(b);
    await typeInto(b,turn.reply,14,chat);b.classList.remove('caret');
    if(turn.quick){const q=document.createElement('div');q.className='quick';q.setAttribute('role','group');q.setAttribute('aria-label','Quick replies');
      turn.quick.forEach(txt=>{const bt=document.createElement('button');bt.textContent=txt;bt.addEventListener('click',()=>{q.remove();sendMessage(txt,a.id);});q.appendChild(bt);});m.appendChild(q);}
  } else if(opts.inProgress){
    const t=document.createElement('div');t.className='typing';t.setAttribute('aria-label',a.name+' is working');t.innerHTML='<i></i><i></i><i></i>';m.appendChild(t);
  }
  scrollChat(chat);
}
function addUserMsg(chat,text){
  const m=document.createElement('div');m.className='msg user';
  const now=new Date();const hh=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  m.innerHTML='<div class="bubble"></div><div class="meta">You · '+hh+'</div>';m.querySelector('.bubble').textContent=text;
  chat.el.appendChild(m);scrollChat(chat);
}
function getChat(a){
  if(chats[a.id])return chats[a.id];
  const chat=chats[a.id]={el:document.createElement('div'),busy:false};
  chat.el.className='chat-inner';
  const f=(a.files||['src/'])[0];
  const sc=a.ask?a:Object.assign({},a,{ask:'Please take care of this: '+a.task.charAt(0).toLowerCase()+a.task.slice(1)+'.',
    think:'Starting with the files involved, then keeping the change small and checking it as I go.',tools:[['read',f,'','ok']],reply:null});
  addUserMsg(chat,sc.ask);
  const inProg=(a.state==='working'||a.state==='thinking');
  const reply=inProg?null:sc.reply;
  chat.busy=true;
  playTurn(chat,a,{think:sc.think,tools:sc.tools,reply:reply,quick:inProg?null:sc.quick},{inProgress:inProg}).then(()=>{chat.busy=false;setSend();});
  return chat;
}
const GENERIC_THINK=[
 'Reading the request and checking which files it touches. I will keep the change small and run the existing tests before reporting back.',
 'This is within the current scope. I will look at the related code first, then make the smallest edit that does what you asked.',
 'Understood. Before changing anything I want to see how this is used elsewhere in the project so I do not break a caller.'];
async function sendMessage(text,forId){
  const a=byId(forId||ui.selected); if(!a)return; const chat=getChat(a);
  text=(text||'').trim(); if(!text&&!attached.length)return;
  if(chat.busy){toast('Hold on, '+esc(a.name)+' is still replying.');return;}
  const files=attached.map(x=>x.name);
  addUserMsg(chat,(text||'(attachment)')+(files.length?'\n\nAttached: '+files.join(', '):''));
  attached=[];renderAttached();
  const input=document.getElementById('msgInput');if(input){input.value='';autoGrow();}
  const prev=a.state; chat.busy=true; setSend();
  if(!a.paused){a.state='thinking';a.label=null;renderAll();}
  const f=(a.files&&a.files[0])||'src/';
  const snippet=text.length>70?text.slice(0,67)+'...':text;
  const turn={think:GENERIC_THINK[Math.floor(Math.random()*GENERIC_THINK.length)]+(snippet?' You said: "'+snippet+'".':''),
    tools:[['read',f,'','ok'],['search',(snippet.split(' ').slice(0,3).join(' ')||'usages'),'5 hits','ok'],['run','npm test','all passing','ok']],
    reply:'Got it. I looked at '+f+' and nothing else depends on it, so I will go ahead with that'+(files.length?', using the attached '+(files.length>1?'files':'file')+' as reference':'')+'. I will post a summary here when it is ready for you to review.'};
  await playTurn(chat,a,turn,{inProgress:false});
  if(!a.paused){a.state=(prev==='thinking'||prev==='working')?prev:'working';}
  chat.busy=false; setSend(); renderAll();
}

  const id=ui.selected; ui.selected=null; document.body.classList.remove('panel-open'); document.getElementById('panel').innerHTML='';
  renderAll();
  const n=id&&document.querySelector(`[data-id="${id}"]`); if(n)n.focus();
}

/* ---------------- events ---------------- */
document.addEventListener('click',e=>{
  const st=e.target.closest('.stat'); if(st){const k=st.dataset.k;ui.status=ui.status===k?null:k;renderAll();const n=document.querySelector(`.stat[data-k="${k}"]`);if(n)n.focus();return;}
  const t=e.target.closest('[data-id]'); if(t&&!t.closest('#panel')){openPanel(t.dataset.id);}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.selected){closePanel();}});
document.getElementById('wsFilter').addEventListener('change',e=>{ui.ws=e.target.value;renderAll();});
function setView(v){ui.view=v;document.body.classList.toggle('list-mode',v==='list');
  document.getElementById('vOffice').setAttribute('aria-pressed',String(v==='office'));document.getElementById('vList').setAttribute('aria-pressed',String(v==='list'));renderAll();}
document.getElementById('vOffice').onclick=()=>setView('office');
document.getElementById('vList').onclick=()=>setView('list');
new ResizeObserver(()=>fit()).observe(document.getElementById('floor'));
window.addEventListener('resize',fit);

renderFilter(); renderAll();
if(qs.get('view')==='list')setView('list');
if(qs.get('open'))openPanel(qs.get('open'),false);
})();
</script>
</body>
</html>
