<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges">
<!--
  Hand-tuned 16x16 version of build/icon.svg (F2a), drawn on the pixel grid with integer coordinates.
  Only the essentials: navy rounded square, amber lead with the arm raised from the shoulder, the status board.
  The team is left out: at 16 px it merges into one pale block.
  Used ONLY for the 16x16 entry of build/icon.ico and the icp4 (16x16) entry of build/icon.icns.
  Every other size (ico 24-256, icns 32-1024 incl. 16@2x, icon.png 1024) is rendered from build/icon.svg.
  Rebuild: rsvg-convert -w N -h N build/icon.svg per size, rsvg-convert -w 16 -h 16 build/icon-16.svg,
  then pack the PNGs with Pillow (ICO, append_images) and icnsutil (ICNS). See PR #246.
-->
<!-- navy rounded square -->
<rect x="2" y="0" width="12" height="1" fill="#2f4a6b"/>
<rect x="1" y="1" width="14" height="1" fill="#2f4a6b"/>
<rect x="0" y="2" width="16" height="12" fill="#2f4a6b"/>
<rect x="1" y="14" width="14" height="1" fill="#2f4a6b"/>
<rect x="2" y="15" width="12" height="1" fill="#2f4a6b"/>
<!-- status board (cream at 16% on navy) with two bars -->
<rect x="9" y="2" width="6" height="5" fill="#4f647f"/>
<rect x="10" y="3" width="4" height="1" fill="#9bc1a0"/>
<rect x="10" y="5" width="3" height="1" fill="#8fb0d3"/>
<!-- lead: head, shoulders, body -->
<rect x="3" y="4" width="2" height="2" fill="#e0a84a"/>
<rect x="3" y="7" width="2" height="1" fill="#e0a84a"/>
<rect x="2" y="8" width="4" height="6" fill="#e0a84a"/>
<!-- arm: one-pixel diagonal up from the right shoulder (row 7) to the board; nothing below the shoulder -->
<rect x="5" y="7" width="1" height="1" fill="#e0a84a"/>
<rect x="6" y="6" width="1" height="1" fill="#e0a84a"/>
<rect x="7" y="5" width="1" height="1" fill="#e0a84a"/>
<rect x="8" y="4" width="1" height="1" fill="#e0a84a"/>
</svg>
